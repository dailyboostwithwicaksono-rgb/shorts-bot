name: shorts-bot

on:
  # Cron dalam UTC. 5x/hari, interval tetap 4j48m (=24j/5), mulai 19:00 WIB.
  # WIB 19:00, 23:48, 04:36, 09:24, 14:12 -> UTC 12:00, 16:48, 21:36, 02:24, 07:12.
  schedule:
    - cron: '0 12 * * *'
    - cron: '48 16 * * *'
    - cron: '36 21 * * *'
    - cron: '24 2 * * *'
    - cron: '12 7 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode konten'
        type: choice
        options:
          - list
          - famous
          - custom
        default: list
      quote_text:
        description: 'Teks quote (wajib untuk mode custom). Pisahkan baris dengan | atau baris baru.'
        type: string
        required: false
      quote_author:
        description: 'Nama/penulis quote (custom). Default: dbcw'
        type: string
        required: false
        default: dbcw
      quote_language:
        description: 'Bahasa quote (auto/id/en)'
        type: choice
        options:
          - auto
          - id
          - en
        default: auto

permissions:
  contents: write

concurrency:
  group: shorts-bot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pasang ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -encoders | grep -q libx264
          test -f assets/fonts/Montserrat-LightItalic.ttf
          test -f assets/fonts/Montserrat-SemiBoldItalic.ttf
          test -f assets/fonts/Montserrat-Italic.ttf
          test -f assets/fonts/OFL.txt
          mkdir -p work/music out

      - name: Pasang dependency Python
        run: pip install -r requirements.txt

      - name: Rencana (quotes + media)
        env:
          TZ: Asia/Jakarta
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: nvidia/nemotron-3.5-lightning:free
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'openrouter' }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          QUOTE_MODE: ${{ inputs.mode || 'list' }}
          QUOTE_TEXT: ${{ inputs.quote_text || '' }}
          QUOTE_AUTHOR: ${{ inputs.quote_author || 'dbcw' }}
          QUOTE_LANGUAGE: ${{ inputs.quote_language || 'auto' }}
        run: python scripts/plan.py

      - name: Render dengan ffmpeg
        run: python scripts/render.py

      - name: Arsipkan hasil ke Drive (OAuth user)
        # Set repository variable ARCHIVE_DRIVE=0 untuk memakai alur tanpa Google Drive/OAuth.
        if: vars.ARCHIVE_DRIVE != '0'
        env:
          TZ: Asia/Jakarta
          GDRIVE_OUTPUTS_FOLDER_ID: ${{ secrets.GDRIVE_OUTPUTS_FOLDER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/archive_drive.py

      - name: "Distribusi/Upload (default: YouTube)"
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Workflow utama: YouTube + WoopSocial (hardcode, tidak bergantung variable repo).
          PUBLISH_TARGETS: youtube,woopsocial,buffer
          PUBLISH_DRY_RUN: ${{ vars.PUBLISH_DRY_RUN || '0' }}
          PUBLISH_FAIL_FAST: ${{ vars.PUBLISH_FAIL_FAST || '1' }}
          # WoopSocial: publish langsung (PUBLISH_NOW) ke IG Reels + TikTok.
          WOOPSOCIAL_API_KEY: ${{ secrets.WOOPSOCIAL_API_KEY }}
          WOOPSOCIAL_PROJECT_ID: '199149673229844480'
          WOOPSOCIAL_IG_ACCOUNT_ID: '199150343760642048'
          WOOPSOCIAL_TIKTOK_ACCOUNT_ID: '199150530960818176'
          WOOPSOCIAL_PLATFORMS: instagram,tiktok
          # Buffer: Facebook Page + Threads, publish langsung (shareNow).
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: '67966ea2f0cdace9b4192336'
          BUFFER_SERVICES: facebook,threads
          BUFFER_MODE: shareNow
          BUFFER_RELEASE_TAG: media
          BUFFER_ASSET_TTL_HOURS: '6'
          # GitHub token untuk menghosting video sebagai Release asset publik.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Kredensial platform lain (opsional, saat target diaktifkan)
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/publish.py

      - name: Commit log & metadata (quotes, cache, video, music)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/used_quotes.jsonl data/pixabay_cache.json data/used_videos.jsonl data/used_music.jsonl || true
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan log/metadata."
            exit 0
          fi
          git commit -m "chore: update logs/metadata (run ${{ github.run_number }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: "Simpan artefak kecil (title/description)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_number }}
          # caption.txt = nama file legacy; isinya adalah title kanonik.
          path: |
            render_plan.json
            out/manifest.json
            out/caption.txt
            out/description.txt
          retention-days: 1
