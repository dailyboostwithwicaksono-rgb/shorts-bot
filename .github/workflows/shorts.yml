name: shorts-bot

on:
  # Cron dalam UTC. 20:00 UTC = 03:00 WIB; 11:00 UTC = 18:00 WIB.
  schedule:
    - cron: '0 20 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode konten'
        type: choice
        options:
          - list
          - famous
          - custom
        default: list
      quote_text:
        description: 'Teks quote (wajib untuk mode custom). Pisahkan baris dengan | atau baris baru.'
        type: string
        required: false
      quote_author:
        description: 'Nama/penulis quote (custom). Default: dbcw'
        type: string
        required: false
        default: dbcw
      quote_language:
        description: 'Bahasa quote (auto/id/en)'
        type: choice
        options:
          - auto
          - id
          - en
        default: auto

permissions:
  contents: write

concurrency:
  group: shorts-bot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pasang ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -encoders | grep -q libx264
          test -f assets/fonts/Montserrat-LightItalic.ttf
          test -f assets/fonts/Montserrat-SemiBoldItalic.ttf
          test -f assets/fonts/Montserrat-Italic.ttf
          test -f assets/fonts/OFL.txt
          mkdir -p work/music out

      - name: Pasang dependency Python
        run: pip install -r requirements.txt

      - name: Rencana (quotes + media)
        env:
          TZ: Asia/Jakarta
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'inclusionai/ling-3.2-flash:free' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'openrouter' }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          QUOTE_MODE: ${{ inputs.mode || 'list' }}
          QUOTE_TEXT: ${{ inputs.quote_text || '' }}
          QUOTE_AUTHOR: ${{ inputs.quote_author || 'dbcw' }}
          QUOTE_LANGUAGE: ${{ inputs.quote_language || 'auto' }}
        run: python scripts/plan.py

      - name: Render dengan ffmpeg
        run: python scripts/render.py

      - name: Arsipkan hasil ke Drive (OAuth user)
        env:
          TZ: Asia/Jakarta
          GDRIVE_OUTPUTS_FOLDER_ID: ${{ secrets.GDRIVE_OUTPUTS_FOLDER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/archive_drive.py

      - name: "Distribusi/Upload (default: YouTube)"
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Multi-target (Fase 4): default youtube agar perilaku tetap sama.
          PUBLISH_TARGETS: ${{ vars.PUBLISH_TARGETS || 'youtube' }}
          PUBLISH_DRY_RUN: ${{ vars.PUBLISH_DRY_RUN || '0' }}
          PUBLISH_FAIL_FAST: ${{ vars.PUBLISH_FAIL_FAST || '1' }}
          # Kredensial platform lain (opsional, saat target diaktifkan)
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/publish.py

      - name: Commit log & metadata (quotes, cache, video, music)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/used_quotes.jsonl data/pixabay_cache.json data/used_videos.jsonl data/used_music.jsonl || true
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan log/metadata."
            exit 0
          fi
          git commit -m "chore: update logs/metadata (run ${{ github.run_number }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: "Simpan artefak kecil (title/description)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_number }}
          # caption.txt = nama file legacy; isinya adalah title kanonik.
          path: |
            render_plan.json
            out/manifest.json
            out/caption.txt
            out/description.txt
          retention-days: 1
